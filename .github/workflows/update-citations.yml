name: Update Google Scholar Citations

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements-citations.txt

      - name: Update citation counts
        run: python scripts/update_citations.py

      - name: Notify about new publications
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('new-papers.json')) {
              console.log('No new papers detected.');
              return;
            }
            const papers = JSON.parse(fs.readFileSync('new-papers.json', 'utf8'));
            if (!papers.length) {
              console.log('No new papers detected.');
              return;
            }
            const lines = papers.map(p =>
              `- [${p.title}](${p.url || '#'}) — ${[p.venue, p.year].filter(Boolean).join(', ')} (citations: ${p.citations})`
            );
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📄 ${papers.length} new publication(s) detected on Google Scholar`,
              body: [
                'The weekly citation sync found paper(s) on your Google Scholar profile that are not listed on the site yet:',
                '',
                ...lines,
                '',
                'Add them to `_pages/publications.md` (Journal/Conference section) if they should be displayed.'
              ].join('\n'),
              labels: ['new-paper']
            });

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Google Scholar citation counts"
          file_pattern: _data/citations.yml
